name = "company-c-accountability"
main = "worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "company-c-accountability"
database_id = "7a398bfd-fa4e-41b1-9be0-26fa9eafd02a"

[vars]
# Where lockout verification codes are sent after 5 failed login attempts.
ALERT_EMAIL = "jbartelme3@icloud.com"

# Secrets (set with `wrangler secret put NAME`, or in .dev.vars for local dev):
#   SITE_PASSWORD    - the shared password gating the whole site (give only to Cadre)
#   SESSION_SECRET   - random string used to sign the session cookie
#   RESEND_API_KEY   - api key from resend.com, used to email lockout verification codes
